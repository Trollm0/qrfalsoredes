
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error de inicio de sesión</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #141e30;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .error {
            background: white;
            padding: 45px;
            width: 380px;
            max-width: 90%;
            border-radius: 15px;
            text-align: center;
        }


        h2 {
            color: #e74c3c;
            margin-bottom: 15px;
        }

        p {
            color: #555;
            line-height: 1.5;
        }

        a {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 25px;
            background: #243b55;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        a:hover {
            background: #141e30;
        }
    </style>
</head>

<body>

    <div class="error">
        <div class="icon"></div>

        <h2>¡Ha ocurrido un error!</h2>

        <p>
            Si fuera un hacker te habria robado las credenciales.</br>
            Por favor, fijate mas antes de logearte en una pagina.
        </p>

        <a href="index.html">Volver al inicio</a>
    </div>

</body>
</html>
