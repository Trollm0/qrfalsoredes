
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #141e30, #243b55);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login {
            background: white;
            padding: 40px;
            width: 350px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: center;
        }

        h2 {
            margin-bottom: 25px;
            color: #243b55;
        }

        input {
            width: 100%;
            padding: 13px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 8px;
            outline: none;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 20px;
            background: #243b55;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: 0.3s;
        }

        button:hover {
            background: #141e30;
        }

        p {
            margin-top: 20px;
            color: #777;
            font-size: 13px;
        }
    </style>
</head>
<body>
    
    <div class="login">
        <h2>Iniciar sesión</h2>

        <form id="loginForm">
            <input type="text"
                   placeholder="Nombre de usuario"
                   required>

            <input type="password"
                   placeholder="Contraseña"
                   required>

            <button type="submit">Iniciar sesión</button>
        </form>

        <p>Introduce tus datos para continuar</p>
        <p>Hecho por Marcos Bayona</p>
    </div>

    <script>
        document.getElementById("loginForm")
            .addEventListener("submit", function(event) {
                event.preventDefault();

                // Redirigir siempre a la página de error
                window.location.href = "error.html";
            });
    </script>

</body>
</html>
